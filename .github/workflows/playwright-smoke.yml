name: Playwright Smoke

on:
  workflow_dispatch:
    inputs:
      server:
        description: Environment to run tests against
        required: true
        type: choice
        default: stage
        options:
          - stage
          - prod
      browserName:
        description: Browser name to run
        required: true
        type: choice
        default: webkit
        options:
          - webkit
          - chromium
      deviceType:
        description: Device type to run
        required: true
        type: choice
        default: Ios
        options:
          - Ios
          - Android
      whoFillsForm:
        description: Who fills the form modal
        required: true
        type: choice
        default: child
        options:
          - child
          - parent
      groupScreenshots:
        description: Group screenshots into a single HTML file after test run
        required: true
        type: boolean
        default: true

jobs:
  smoke:
    name: smoke (${{ inputs.server }} / ${{ inputs.browserName }} / ${{ inputs.deviceType }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
    timeout-minutes: 60
    env:
      CI: true
      IS_CI: "true"
      HEADLESS: "true"
      SERVER: ${{ inputs.server }}
      BROWSER_NAME: ${{ inputs.browserName }}
      DEVICE_TYPE: ${{ inputs.deviceType }}
      WHO_FILLS_FORM: ${{ inputs.whoFillsForm }}
      GROUP_SCREENSHOTS: ${{ inputs.groupScreenshots }}
      LOG_LEVEL: info

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npx playwright test --project=smoke

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts-${{ inputs.server }}-${{ inputs.browserName }}-${{ inputs.deviceType }}-${{ github.run_id }}
          path: |
            artifacts/
            playwright-report/
            allure-results/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
