name: Playwright Smoke

on:
  workflow_dispatch:
    inputs:
      server:
        description: Environment to run tests against
        required: true
        type: choice
        default: stage
        options:
          - stage
          - prod
      browserName:
        description: Browser name to run
        required: true
        type: choice
        default: webkit
        options:
          - webkit
          - chromium
      deviceType:
        description: Device type to run
        required: true
        type: choice
        default: Ios
        options:
          - Ios
          - Android
      whoFillsForm:
        description: Who fills the form modal
        required: true
        type: choice
        default: child
        options:
          - child
          - parent
      groupScreenshots:
        description: Group screenshots into a single HTML file after test run
        required: true
        type: boolean
        default: true

jobs:
  smoke:
    name: smoke (${{ inputs.server }} / ${{ inputs.browserName }} / ${{ inputs.deviceType }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
    timeout-minutes: 60
    env:
      CI: true
      IS_CI: "true"
      HEADLESS: "true"
      SERVER: ${{ inputs.server }}
      BROWSER_NAME: ${{ inputs.browserName }}
      DEVICE_TYPE: ${{ inputs.deviceType }}
      WHO_FILLS_FORM: ${{ inputs.whoFillsForm }}
      GROUP_SCREENSHOTS: ${{ inputs.groupScreenshots }}
      SUITE: smoke
      LOG_LEVEL: info
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'us-east-1' }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_DOMAIN: ${{ vars.S3_DOMAIN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Install Java and AWS CLI
        run: |
          apt-get update
          apt-get install -y --no-install-recommends openjdk-17-jre-headless unzip curl
          if ! command -v aws >/dev/null 2>&1; then
            curl -sS "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
            unzip -q awscliv2.zip
            ./aws/install
            rm -rf awscliv2.zip aws
          fi
          java -version
          aws --version

      - name: Run smoke tests
        run: npx playwright test --project=smoke

      - name: Upload Playwright HTML report to S3
        if: always()
        run: |
          set -e
          if [ -z "${S3_BUCKET}" ] || [ -z "${S3_DOMAIN}" ]; then
            echo "S3_BUCKET/S3_DOMAIN not set; skipping Playwright report upload."
            exit 0
          fi
          if [ ! -f artifacts/trace_report_s3_bucket.txt ]; then
            echo "artifacts/trace_report_s3_bucket.txt not found; skipping Playwright report upload."
            exit 0
          fi
          if [ ! -d playwright-report ]; then
            echo "playwright-report/ not found; skipping Playwright report upload."
            exit 0
          fi

          TRACE_BUCKET_PATH="$(cat artifacts/trace_report_s3_bucket.txt)"
          echo "Uploading playwright-report/ → s3://${TRACE_BUCKET_PATH}"
          aws s3 sync playwright-report/ "s3://${TRACE_BUCKET_PATH}" --only-show-errors

          RELATIVE_PATH="${TRACE_BUCKET_PATH#${S3_BUCKET}/}"
          S3_DOMAIN_TRIMMED="${S3_DOMAIN%/}"
          TRACE_URL="${S3_DOMAIN_TRIMMED}/${RELATIVE_PATH}/index.html"
          echo "TRACE_URL=${TRACE_URL}" >> artifacts/report-urls.txt
          echo "Playwright report uploaded: ${TRACE_URL}"

      - name: Print report URLs
        if: always()
        run: |
          echo "============================================================"
          echo "Report URLs (CloudFront / Basic Auth required)"
          echo "============================================================"
          if [ -f artifacts/report-urls.txt ]; then
            ALLURE_URL="$(grep '^ALLURE_URL=' artifacts/report-urls.txt | cut -d= -f2- || true)"
            TRACE_URL="$(grep '^TRACE_URL=' artifacts/report-urls.txt | cut -d= -f2- || true)"
            SCREENSHOTS_URL="$(grep '^SCREENSHOTS_URL=' artifacts/report-urls.txt | cut -d= -f2- || true)"
            echo "Allure:       ${ALLURE_URL:-"(not uploaded)"}"
            echo "Playwright:   ${TRACE_URL:-"(not uploaded)"}"
            echo "Screenshots:  ${SCREENSHOTS_URL:-"(not uploaded)"}"
          else
            echo "artifacts/report-urls.txt not found (S3 upload may have been skipped)."
          fi
          echo "============================================================"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts-${{ inputs.server }}-${{ inputs.browserName }}-${{ inputs.deviceType }}-${{ github.run_id }}
          path: |
            artifacts/
            playwright-report/
            allure-results/
            allure-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
